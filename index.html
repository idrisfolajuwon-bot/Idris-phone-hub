<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Idris Phone Hub</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f7fa;
  color:#111827;
}

header{
  background:#111827;
  color:white;
  padding:15px;
  position:sticky;
  top:0;
  z-index:100;
}

.header{
  max-width:1200px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:22px;
  font-weight:bold;
}

.logo span{
  color:#22c55e;
}

.sell{
  background:#22c55e;
  color:white;
  border:0;
  padding:11px 15px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.hero{
  background:linear-gradient(135deg,#111827,#263449);
  color:white;
  text-align:center;
  padding:45px 15px;
}

.hero h1{
  font-size:34px;
  margin-bottom:10px;
}

.hero p{
  color:#d1d5db;
  margin-bottom:20px;
}

.search{
  max-width:650px;
  margin:auto;
  display:flex;
}

.search input{
  flex:1;
  padding:15px;
  border:0;
  outline:none;
  border-radius:10px 0 0 10px;
  font-size:16px;
}

.search button{
  border:0;
  background:#22c55e;
  color:white;
  padding:0 20px;
  border-radius:0 10px 10px 0;
}

.container{
  max-width:1200px;
  margin:25px auto;
  padding:0 15px;
}

.brands{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding-bottom:15px;
}

.brand{
  background:white;
  border:1px solid #ddd;
  padding:10px 15px;
  border-radius:25px;
  white-space:nowrap;
  cursor:pointer;
}

.brand.active{
  background:#22c55e;
  color:white;
  border-color:#22c55e;
}

.title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
}

.card{
  background:white;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 3px 12px #0001;
}

.phone-image{
  height:190px;
  background:#e9edf1;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:70px;
  overflow:hidden;
}

.phone-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.card-body{
  padding:15px;
}

.card-body h3{
  margin-bottom:7px;
}

.price{
  color:#16a34a;
  font-weight:bold;
  font-size:19px;
  margin:7px 0;
}

.info{
  color:#666;
  font-size:14px;
  margin:5px 0;
}

.view{
  width:100%;
  margin-top:10px;
  padding:11px;
  background:#111827;
  color:white;
  border:0;
  border-radius:8px;
  cursor:pointer;
}

.no-result{
  display:none;
  text-align:center;
  padding:50px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0009;
  z-index:500;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal-box{
  width:100%;
  max-width:550px;
  max-height:92vh;
  overflow:auto;
  background:white;
  border-radius:15px;
  padding:22px;
  position:relative;
}

.close{
  position:absolute;
  right:18px;
  top:12px;
  font-size:28px;
  cursor:pointer;
}

.big-image{
  height:250px;
  background:#e9edf1;
  border-radius:12px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:90px;
  overflow:hidden;
  margin-bottom:15px;
}

.big-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.detail-price{
  color:#16a34a;
  font-size:25px;
  font-weight:bold;
  margin:8px 0;
}

.form-group{
  margin-bottom:15px;
}

.form-group label{
  display:block;
  font-weight:bold;
  margin-bottom:6px;
}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:8px;
  outline:none;
}

.form-group textarea{
  height:90px;
}

.submit{
  width:100%;
  padding:13px;
  background:#22c55e;
  color:white;
  border:0;
  border-radius:8px;
  font-size:16px;
  font-weight:bold;
}

footer{
  background:#111827;
  color:white;
  text-align:center;
  padding:30px 15px;
  margin-top:50px;
}

footer p{
  color:#aaa;
  margin-top:8px;
}

@media(max-width:500px){

  .products{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .phone-image{
    height:160px;
  }

  .hero h1{
    font-size:28px;
  }

  .logo{
    font-size:18px;
  }
}
</style>
</head>

<body>

<header>
<div class="header">

<div class="logo">
Idris <span>Phone Hub</span>
</div>

<button class="sell" onclick="openSell()">
+ Sell Phone
</button>

</div>
</header>


<section class="hero">

<h1>Idris Phone Hub 📱</h1>

<p>Find phones from many brands in Nigeria.</p>

<div class="search">

<input
id="search"
type="text"
placeholder="Search iPhone 12, Tecno, Samsung..."
oninput="showPhones()"
>

<button onclick="showPhones()">Search</button>

</div>

</section>


<main class="container">

<div class="brands" id="brands"></div>

<div class="title">

<h2 id="heading">All Phones</h2>

<span id="number"></span>

</div>

<div class="products" id="products"></div>

<div class="no-result" id="none">

<h2>No phone found 😔</h2>

<p>Try another search.</p>

</div>

</main>


<footer>

<h2>Idris Phone Hub</h2>
<p>Buy • Sell • Upgrade 📱</p>
<p>© 2026 Idris Phone Hub</p>

</footer>


<!-- PHONE DETAILS -->

<div class="modal" id="details">

<div class="modal-box">

<span class="close" onclick="closeDetails()">×</span>

<div class="big-image" id="bigImage">📱</div>

<h2 id="detailName"></h2>

<div class="detail-price" id="detailPrice"></div>

<p id="detailBrand"></p>
<p id="detailLocation"></p>
<p id="detailCondition"></p>

<br>

<p id="detailDescription"></p>

<br>

<button class="submit" onclick="contactSeller()">
Contact Seller
</button>

</div>
</div>


<!-- SELL PHONE -->

<div class="modal" id="sellModal">

<div class="modal-box">

<span class="close" onclick="closeSell()">×</span>

<h2>Sell Your Phone 📱</h2>

<form id="sellForm">

<div class="form-group">
<label>Phone Model</label>
<input id="model" placeholder="Example: iPhone 14 Pro" required>
</div>

<div class="form-group">
<label>Brand</label>

<select id="brandSelect" required>

<option value="">Choose brand</option>

</select>

</div>

<div class="form-group">
<label>Price (₦)</label>
<input id="price" type="number" placeholder="350000" required>
</div>

<div class="form-group">
<label>Location</label>
<input id="location" placeholder="Lagos" required>
</div>

<div class="form-group">
<label>Condition</label>

<select id="condition" required>

<option value="">Choose condition</option>
<option>Brand New</option>
<option>UK Used</option>
<option>Tokunbo</option>
<option>Fairly Used</option>
<option>Used</option>

</select>

</div>

<div class="form-group">
<label>Phone Image URL</label>
<input id="image" placeholder="Paste image URL">
</div>

<div class="form-group">
<label>Description</label>
<textarea id="description" placeholder="Describe the phone..." required></textarea>
</div>

<div class="form-group">
<label>Seller Name</label>
<input id="seller" placeholder="Your name" required>
</div>

<div class="form-group">
<label>Seller Phone</label>
<input id="sellerPhone" placeholder="08012345678" required>
</div>

<button class="submit" type="submit">
Post Phone
</button>

</form>

</div>
</div>

/* BRANDS */

const brands=[

"All",
"iPhone",
"Samsung",
"Tecno",
"Infinix",
"itel",
"Xiaomi",
"Redmi",
"POCO",
"OPPO",
"vivo",
"OnePlus",
"Google Pixel",
"Nokia",
"Motorola",
"Huawei",
"HONOR",
"Sony",
"Realme",
"ZTE",
"ASUS",
"Nothing",
"Lenovo",
"Alcatel"

];


let selected=null;

let activeBrand="All";


function createBrandButtons(){

const box=document.getElementById("brands");

const select=document.getElementById("brandSelect");

brands.forEach((brand,index)=>{

const button=document.createElement("button");

button.className="brand";

if(index===0){

button.classList.add("active");

}

button.textContent=brand;

button.onclick=()=>{

activeBrand=brand;

document
.querySelectorAll(".brand")
.forEach(b=>b.classList.remove("active"));

button.classList.add("active");

document.getElementById("heading").textContent=
brand==="All"?"All Phones":brand+" Phones";

showPhones();

};

box.appendChild(button);


if(brand!=="All"){

const option=document.createElement("option");

option.value=brand;

option.textContent=brand;

select.appendChild(option);

}

});

}


function showPhones(){

const box=document.getElementById("products");

const search=document
.getElementById("search")
.value
.toLowerCase();

let list=phones.filter(phone=>{

const brandOK=
activeBrand==="All" ||
phone[0]===activeBrand;

const searchOK=
phone[1].toLowerCase().includes(search) ||
phone[0].toLowerCase().includes(search);

return brandOK && searchOK;

});


box.innerHTML="";

document.getElementById("number").textContent=
list.length+" phones";


if(list.length===0){

document.getElementById("none").style.display="block";

return;

}

document.getElementById("none").style.display="none";


list.forEach(phone=>{

const card=document.createElement("div");

card.className="card";

card.innerHTML=`

<div class="phone-image">
📱
</div>

<div class="card-body">

<h3>${phone[1]}</h3>

<div class="price">
Price available from sellers
</div>

<div class="info">
🏷️ ${phone[0]}
</div>

<div class="info">
🇳🇬 Nigeria
</div>

<button class="view">
View / Find Seller
</button>

</div>

`;

card.querySelector(".view").onclick=()=>{

showDetails({

brand:phone[0],
name:phone[1],
price:"Price varies",
location:"Nigeria",
condition:"Depends on seller",
description:
"This model is available on Idris Phone Hub. Sellers can list their own phone with price, location and condition."

});

};

box.appendChild(card);

});

}


function showDetails(phone){

selected=phone;

document.getElementById("bigImage").innerHTML="📱";

document.getElementById("detailName").textContent=
phone.name;

document.getElementById("detailPrice").textContent=
phone.price==="Price varies"
?"Price varies by seller"
:"₦"+Number(phone.price).toLocaleString();

document.getElementById("detailBrand").textContent=
"🏷️ Brand: "+phone.brand;

document.getElementById("detailLocation").textContent=
"📍 "+phone.location;

document.getElementById("detailCondition").textContent=
"📦 "+phone.condition;

document.getElementById("detailDescription").textContent=
phone.description;

document.getElementById("details").style.display="flex";

}


function closeDetails(){

document.getElementById("details").style.display="none";

}


function openSell(){

document.getElementById("sellModal").style.display="flex";

}


function closeSell(){

document.getElementById("sellModal").style.display="none";

}


function contactSeller(){

if(selected && selected.sellerPhone){

window.location.href=
"tel:"+selected.sellerPhone;

}else{

alert(
"This is the phone catalog. Seller contact will appear when a seller lists this phone."
);

}

}


/* SAVE SELLER LISTING TO FIRESTORE */

document
.getElementById("sellForm")
.addEventListener("submit",async function(e){

e.preventDefault();

const button=this.querySelector("button");

button.disabled=true;

button.textContent="Posting...";


try{

await addDoc(
collection(db,"phones"),
{

model:document.getElementById("model").value,

brand:document.getElementById("brandSelect").value,

price:Number(document.getElementById("price").value),

location:document.getElementById("location").value,

condition:document.getElementById("condition").value,

image:document.getElementById("image").value,

description:document.getElementById("description").value,

seller:document.getElementById("seller").value,

sellerPhone:document.getElementById("sellerPhone").value,

createdAt:serverTimestamp()

}

);

alert("🎉 Phone posted successfully!");

this.reset();

closeSell();

}catch(error){

console.error(error);

alert(
"Could not post the phone. Please check your Firebase Firestore settings."
);

}

button.disabled=false;

button.textContent="Post Phone";

});


createBrandButtons();

showPhones();


window.onclick=function(e){

if(e.target===document.getElementById("details")){

closeDetails();

}

if(e.target===document.getElementById("sellModal")){

closeSell();

}

};
