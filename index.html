<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Idris Phone Hub</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f6f8;
  color:#111;
}

header{
  background:#111827;
  color:white;
  padding:18px 15px;
  position:sticky;
  top:0;
  z-index:100;
}

.header{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-size:23px;
  font-weight:bold;
}

.logo span{
  color:#22c55e;
}

.sell-btn{
  background:#22c55e;
  color:white;
  border:0;
  padding:11px 15px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.hero{
  background:linear-gradient(135deg,#111827,#1f2937);
  color:white;
  text-align:center;
  padding:45px 15px;
}

.hero h1{
  font-size:32px;
  margin-bottom:10px;
}

.hero p{
  color:#d1d5db;
  margin-bottom:22px;
}

.search{
  max-width:600px;
  margin:auto;
  display:flex;
}

.search input{
  width:100%;
  padding:15px;
  border:0;
  outline:none;
  border-radius:10px 0 0 10px;
  font-size:16px;
}

.search button{
  border:0;
  background:#22c55e;
  color:white;
  padding:0 20px;
  border-radius:0 10px 10px 0;
  cursor:pointer;
}

.container{
  max-width:1100px;
  margin:30px auto;
  padding:0 15px;
}

.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding-bottom:10px;
  margin-bottom:25px;
}

.category{
  background:white;
  border:1px solid #ddd;
  padding:10px 16px;
  border-radius:20px;
  white-space:nowrap;
  cursor:pointer;
}

.category.active,
.category:hover{
  background:#22c55e;
  color:white;
  border-color:#22c55e;
}

.section-title{
  margin-bottom:18px;
  font-size:24px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
}

.card{
  background:white;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
}

.phone-img{
  width:100%;
  height:210px;
  background:#e5e7eb;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:70px;
}

.card-body{
  padding:16px;
}

.card h3{
  margin-bottom:8px;
}

.price{
  color:#16a34a;
  font-size:20px;
  font-weight:bold;
  margin-bottom:8px;
}

.location{
  color:#666;
  font-size:14px;
  margin-bottom:14px;
}

.view-btn{
  width:100%;
  border:0;
  background:#111827;
  color:white;
  padding:11px;
  border-radius:8px;
  cursor:pointer;
}

.no-result{
  text-align:center;
  padding:40px;
  display:none;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:200;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal-box{
  background:white;
  width:100%;
  max-width:500px;
  max-height:90vh;
  overflow:auto;
  border-radius:15px;
  padding:22px;
  position:relative;
}

.close{
  position:absolute;
  right:18px;
  top:15px;
  font-size:25px;
  cursor:pointer;
}

.modal-box h2{
  margin-bottom:20px;
}

.detail-image{
  height:220px;
  background:#e5e7eb;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:80px;
  margin-bottom:18px;
}

.detail-price{
  color:#16a34a;
  font-size:24px;
  font-weight:bold;
  margin:10px 0;
}

.form-group{
  margin-bottom:15px;
}

.form-group label{
  display:block;
  margin-bottom:6px;
  font-weight:bold;
}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:8px;
  outline:none;
}

.form-group textarea{
  height:90px;
  resize:none;
}

.submit-btn{
  width:100%;
  background:#22c55e;
  color:white;
  border:0;
  padding:13px;
  border-radius:8px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

footer{
  background:#111827;
  color:white;
  text-align:center;
  padding:30px 15px;
  margin-top:50px;
}

footer p{
  color:#aaa;
  margin-top:8px;
}

@media(max-width:500px){
  .hero h1{
    font-size:27px;
  }

  .logo{
    font-size:19px;
  }

  .sell-btn{
    padding:9px 11px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header">
    <div class="logo">Idris <span>Phone Hub</span></div>
    <button class="sell-btn" onclick="openSell()">+ Sell Phone</button>
  </div>
</header>

<section class="hero">
  <h1>Find Your Next Phone 📱</h1>
  <p>Buy and sell phones easily with Idris Phone Hub.</p>

  <div class="search">
    <input
      type="text"
      id="searchInput"
      placeholder="Search iPhone, Samsung, Tecno..."
      oninput="searchPhones()"
    >
    <button onclick="searchPhones()">Search</button>
  </div>
</section>

<main class="container">

  <div class="categories">
    <button class="category active" onclick="filterCategory('All',this)">All</button>
    <button class="category" onclick="filterCategory('iPhone',this)">iPhone</button>
    <button class="category" onclick="filterCategory('Samsung',this)">Samsung</button>
    <button class="category" onclick="filterCategory('Tecno',this)">Tecno</button>
    <button class="category" onclick="filterCategory('Infinix',this)">Infinix</button>
    <button class="category" onclick="filterCategory('Android',this)">Android</button>
  </div>

  <h2 class="section-title">Latest Phones</h2>

  <div class="products" id="products"></div>

  <div class="no-result" id="noResult">
    <h2>No phone found 😔</h2>
    <p>Try searching for another phone.</p>
  </div>

</main>

<footer>
  <h2>Idris Phone Hub</h2>
  <p>Buy. Sell. Upgrade. 📱</p>
  <p>© 2026 Idris Phone Hub</p>
</footer>

<!-- PHONE DETAILS MODAL -->

<div class="modal" id="detailModal">
  <div class="modal-box">
    <span class="close" onclick="closeDetail()">×</span>

    <div class="detail-image" id="detailIcon">📱</div>

    <h2 id="detailName"></h2>
    <div class="detail-price" id="detailPrice"></div>
    <p id="detailLocation"></p>
    <br>
    <p id="detailDescription"></p>
    <br>

    <button class="submit-btn" onclick="contactSeller()">
      Contact Seller
    </button>
  </div>
</div>

<!-- SELL PHONE MODAL -->

<div class="modal" id="sellModal">
  <div class="modal-box">

    <span class="close" onclick="closeSell()">×</span>

    <h2>Sell Your Phone 📱</h2>

    <form onsubmit="submitPhone(event)">

      <div class="form-group">
        <label>Phone Name</label>
        <input
          type="text"
          id="phoneName"
          placeholder="e.g. iPhone 12"
          required
        >
      </div>

      <div class="form-group">
        <label>Brand</label>
        <select id="phoneBrand" required>
          <option value="">Select brand</option>
          <option>iPhone</option>
          <option>Samsung</option>
          <option>Tecno</option>
          <option>Infinix</option>
          <option>Android</option>
        </select>
      </div>

      <div class="form-group">
        <label>Price (₦)</label>
        <input
          type="number"
          id="phonePrice"
          placeholder="e.g. 250000"
          required
        >
      </div>

      <div class="form-group">
        <label>Location</label>
        <input
          type="text"
          id="phoneLocation"
          placeholder="e.g. Lagos"
          required
        >
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea
          id="phoneDescription"
          placeholder="Describe the phone..."
          required
        ></textarea>
      </div>

      <button class="submit-btn" type="submit">
        Post Phone
      </button>

    </form>

  </div>
</div>

<script>

let phones = [

  {
    name:"iPhone 12",
    brand:"iPhone",
    price:295000,
    location:"Lagos",
    icon:"📱",
    description:"iPhone 12 in good condition."
  },

  {
    name:"iPhone 13",
    brand:"iPhone",
    price:385000,
    location:"Lagos",
    icon:"📱",
    description:"Clean iPhone 13 available for sale."
  },

  {
    name:"Samsung Galaxy S23",
    brand:"Samsung",
    price:420000,
    location:"Lagos",
    icon:"📱",
    description:"Samsung Galaxy S23 in excellent condition."
  },

  {
    name:"Tecno Camon 30",
    brand:"Tecno",
    price:220000,
    location:"Ikorodu",
    icon:"📱",
    description:"Tecno Camon 30 with great camera and battery."
  },

  {
    name:"Infinix Note 40",
    brand:"Infinix",
    price:210000,
    location:"Lagos",
    icon:"📱",
    description:"Infinix Note 40 available now."
  },

  {
    name:"Tecno Spark",
    brand:"Tecno",
    price:150000,
    location:"Agbowa",
    icon:"📱",
    description:"Affordable Tecno phone in good condition."
  }

];

let currentCategory = "All";
let selectedPhone = null;

function formatPrice(price){
  return "₦" + Number(price).toLocaleString();
}

function displayPhones(){

  const container = document.getElementById("products");
  const noResult = document.getElementById("noResult");
  const search = document.getElementById("searchInput").value.toLowerCase();

  container.innerHTML = "";

  let filtered = phones.filter(phone => {

    const categoryMatch =
      currentCategory === "All" ||
      phone.brand === currentCategory ||
      (currentCategory === "Android" && phone.brand !== "iPhone");

    const searchMatch =
      phone.name.toLowerCase().includes(search) ||
      phone.brand.toLowerCase().includes(search) ||
      phone.location.toLowerCase().includes(search);

    return categoryMatch && searchMatch;
  });

  if(filtered.length === 0){

    noResult.style.display = "block";
    return;

  }else{

    noResult.style.display = "none";

  }

  filtered.forEach((phone,index)=>{

    const realIndex = phones.indexOf(phone);

    container.innerHTML += `

      <div class="card">

        <div class="phone-img">
          ${phone.icon}
        </div>

        <div class="card-body">

          <h3>${phone.name}</h3>

          <div class="price">
            ${formatPrice(phone.price)}
          </div>

          <div class="location">
            📍 ${phone.location}
          </div>

          <button
            class="view-btn"
            onclick="viewPhone(${realIndex})"
          >
            View Phone
          </button>

        </div>

      </div>

    `;

  });

}

function searchPhones(){
  displayPhones();
}

function filterCategory(category,button){

  currentCategory = category;

  document
    .querySelectorAll(".category")
    .forEach(btn => btn.classList.remove("active"));

  button.classList.add("active");

  displayPhones();
}

function viewPhone(index){

  selectedPhone = phones[index];

  document.getElementById("detailIcon").textContent =
    selectedPhone.icon;

  document.getElementById("detailName").textContent =
    selectedPhone.name;

  document.getElementById("detailPrice").textContent =
    formatPrice(selectedPhone.price);

  document.getElementById("detailLocation").textContent =
    "📍 " + selectedPhone.location;

  document.getElementById("detailDescription").textContent =
    selectedPhone.description;

  document.getElementById("detailModal").style.display = "flex";
}

function closeDetail(){
  document.getElementById("detailModal").style.display = "none";
}

function contactSeller(){

  if(!selectedPhone) return;

  alert(
    "Seller contact will be connected here soon for " +
    selectedPhone.name
  );

}

function openSell(){
  document.getElementById("sellModal").style.display = "flex";
}

function closeSell(){
  document.getElementById("sellModal").style.display = "none";
}

function submitPhone(event){

  event.preventDefault();

  const newPhone = {

    name:document.getElementById("phoneName").value,

    brand:document.getElementById("phoneBrand").value,

    price:document.getElementById("phonePrice").value,

    location:document.getElementById("phoneLocation").value,

    description:document.getElementById("phoneDescription").value,

    icon:"📱"

  };

  phones.unshift(newPhone);

  event.target.reset();

  closeSell();

  currentCategory = "All";

  document
    .querySelectorAll(".category")
    .forEach(btn => btn.classList.remove("active"));

  document
    .querySelector(".category")
    .classList.add("active");

  displayPhones();

  alert("Phone posted successfully! 🎉");

}

window.onclick = function(event){

  const detail = document.getElementById("detailModal");
  const sell = document.getElementById("sellModal");

  if(event.target === detail){
    closeDetail();
  }

  if(event.target === sell){
    closeSell();
  }

}

displayPhones();

</script>

</body>
</html>
