<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Idris Study Hub</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fb;
color:#172033;
}

header{
background:#111827;
color:white;
padding:18px;
}

.nav{
max-width:900px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:22px;
font-weight:bold;
}

.logo span{
color:#22c55e;
}

.hero{
background:linear-gradient(135deg,#111827,#243b55);
color:white;
text-align:center;
padding:45px 20px;
}

.hero h1{
font-size:34px;
margin-bottom:10px;
}

.hero p{
color:#d1d5db;
font-size:16px;
}

.container{
max-width:900px;
margin:25px auto;
padding:0 15px;
}

.title{
text-align:center;
margin-bottom:20px;
}

.subjects{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

.subject{
background:white;
border:0;
border-radius:15px;
padding:25px 10px;
font-size:18px;
font-weight:bold;
box-shadow:0 3px 12px #0001;
cursor:pointer;
}

.subject:hover{
transform:scale(1.02);
}

.icon{
font-size:35px;
display:block;
margin-bottom:8px;
}

.quiz{
display:none;
background:white;
border-radius:15px;
padding:20px;
box-shadow:0 3px 15px #0001;
}

.quizTop{
display:flex;
justify-content:space-between;
margin-bottom:20px;
font-weight:bold;
}

.question{
font-size:20px;
font-weight:bold;
line-height:1.5;
margin-bottom:20px;
}

.option{
display:block;
width:100%;
text-align:left;
padding:14px;
margin:10px 0;
border:1px solid #ddd;
background:#f9fafb;
border-radius:10px;
font-size:16px;
cursor:pointer;
}

.option:hover{
background:#eef2ff;
}

.correct{
background:#dcfce7 !important;
border-color:#22c55e !important;
}

.wrong{
background:#fee2e2 !important;
border-color:#ef4444 !important;
}

.next{
width:100%;
padding:14px;
background:#111827;
color:white;
border:0;
border-radius:10px;
font-size:16px;
font-weight:bold;
margin-top:15px;
cursor:pointer;
}

.next:disabled{
background:#9ca3af;
}

.feedback{
margin-top:15px;
font-weight:bold;
min-height:25px;
}

.result{
display:none;
background:white;
border-radius:15px;
padding:30px 20px;
text-align:center;
box-shadow:0 3px 15px #0001;
}

.result h2{
font-size:30px;
margin-bottom:15px;
}

.score{
font-size:45px;
font-weight:bold;
color:#16a34a;
margin:20px;
}

.restart{
background:#22c55e;
color:white;
border:0;
padding:14px 25px;
border-radius:10px;
font-weight:bold;
font-size:16px;
cursor:pointer;
margin:5px;
}

.home{
background:#111827;
color:white;
border:0;
padding:14px 25px;
border-radius:10px;
font-weight:bold;
font-size:16px;
cursor:pointer;
margin:5px;
}

footer{
margin-top:50px;
background:#111827;
color:white;
text-align:center;
padding:25px;
}

footer p{
color:#aaa;
margin-top:8px;
}

@media(max-width:500px){

.hero h1{
font-size:28px;
}

.subjects{
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.subject{
padding:20px 5px;
font-size:15px;
}

.icon{
font-size:30px;
}

.question{
font-size:18px;
}

}

</style>
</head>


<body>


<header>

<div class="nav">

<div class="logo">
Idris <span>Study Hub</span>
</div>

<div>
📚
</div>

</div>

</header>


<section class="hero">

<h1>Idris Study Hub 📚</h1>

<p>
JAMB • NECO • CBT Practice
</p>

</section>


<main class="container">


<!-- HOME -->

<section id="home">

<div class="title">

<h2>Choose Your Subject</h2>

<p style="margin-top:8px;color:#666;">
Start practicing below 👇
</p>

</div>


<div class="subjects">


<button class="subject" onclick="startQuiz('English')">

<span class="icon">📖</span>

English

</button>


<button class="subject" onclick="startQuiz('Mathematics')">

<span class="icon">🧮</span>

Mathematics

</button>


<button class="subject" onclick="startQuiz('Physics')">

<span class="icon">⚛️</span>

Physics

</button>


<button class="subject" onclick="startQuiz('Chemistry')">

<span class="icon">🧪</span>

Chemistry

</button>


<button class="subject" onclick="startQuiz('Biology')">

<span class="icon">🧬</span>

Biology

</button>


<button class="subject" onclick="startQuiz('General')">

<span class="icon">🔥</span>

Mixed Practice

</button>


</div>

</section>



<!-- QUIZ -->

<section class="quiz" id="quiz">

<div class="quizTop">

<span id="subjectName">
Subject
</span>

<span id="questionNumber">
1 / 10
</span>

</div>


<div class="question" id="question">
Question goes here
</div>


<div id="options"></div>


<div class="feedback" id="feedback"></div>


<button class="next" id="nextButton" disabled onclick="nextQuestion()">

Next Question ➜

</button>

</section>



<!-- RESULT -->

<section class="result" id="result">

<h2>🎉 Quiz Complete!</h2>

<p id="resultText">
You have finished the quiz.
</p>

<div class="score" id="score">
0 / 10
</div>

<button class="restart" onclick="restartQuiz()">
🔄 Try Again
</button>

<button class="home" onclick="goHome()">
🏠 Home
</button>

</section>


</main>



<footer>

<h3>Idris Study Hub 📚</h3>

<p>
Learn • Practice • Improve
</p>

<p>
© 2026 Idris Study Hub
</p>

</footer>



<script>

Physics:[

o:["Tissue","Organ","Cell","System"],

},

},

{

o:["Respiration","Photosynthesis","Digestion","Excretion"],

},

{

o:["Flower","Leaf","Root","Fruit"],

},

{
q:"The human lungs are mainly used for:",
o:["Digestion","Gas exchange","Pumping blood","Movement"],

},

o:["Red blood cells","White blood cells","Platelets","Plasma"],

o:["Heart","Kidney","Lung","Stomach"],

o:["Vitamin A","Vitamin B","Vitamin C","Vitamin D"],

},

o:["Respiration","Reproduction","Digestion","Excretion"],

{

o:["Joule","Newton","Watt","Volt"],
a:1
},

{
q:"What is 12 × 5?",

a:1
},

{
q:"The basic unit of life is the:",
o:["Organ","Cell","Tissue","Bone"],
a:1
},

{
q:"The chemical formula for water is:",
o:["CO2","H2O","O2","NaCl"],
a:1
},

{
q:"The opposite of 'ancient' is:",
o:["Old","Modern","Past","Former"],
a:1
},

{
q:"What is 25% of 100?",
o:["10","20","25","50"],
a:2
},

{
q:"Which organ pumps blood?",
o:["Lung","Heart","Kidney","Brain"],

},

{
q:"Which gas is needed for combustion?",
o:["Oxygen","Nitrogen","Carbon dioxide","Helium"],
a:0
},

{
q:"What is the square of 10?",
o:["20","50","100","200"],

},

{

o:["Speed","Mass","Velocity","Time"],

}

]

};



/* VARIABLES */

let currentSubject="";
let currentQuestions=[];
let currentIndex=0;
let score=0;
let answered=false;



/* START QUIZ */

function startQuiz(subject){

currentSubject=subject;

currentQuestions=questions[subject];

currentIndex=0;

score=0;

answered=false;

document.getElementById("home").style.display="none";

document.getElementById("result").style.display="none";

document.getElementById("quiz").style.display="block";

document.getElementById("subjectName").textContent=
subject+" Practice";

showQuestion();

}



/* SHOW QUESTION */

function showQuestion(){

answered=false;

const item=currentQuestions[currentIndex];

document.getElementById("questionNumber").textContent=
(currentIndex+1)+" / "+currentQuestions.length;

document.getElementById("question").textContent=
item.q;

document.getElementById("feedback").textContent="";

const options=document.getElementById("options");

options.innerHTML="";

item.o.forEach((option,index)=>{

const button=document.createElement("button");

button.className="option";

button.textContent=
String.fromCharCode(65+index)+". "+option;

button.onclick=()=>checkAnswer(index,button);

options.appendChild(button);

});

document.getElementById("nextButton").disabled=true;

document.getElementById("nextButton").textContent=
currentIndex===currentQuestions.length-1
?"Finish Quiz"
:"Next Question ➜";

}



/* CHECK ANSWER */

function checkAnswer(index,button){

if(answered)return;

answered=true;

const item=currentQuestions[currentIndex];

const allOptions=document.querySelectorAll(".option");

allOptions.forEach((option,i)=>{

if(i===item.a){
option.classList.add("correct");
}

});

if(index===item.a){

score++;

document.getElementById("feedback").textContent=
"✅ Correct! Well done.";

}else{

button.classList.add("wrong");

document.getElementById("feedback").textContent=
"❌ Not quite. The correct answer is "+
String.fromCharCode(65+item.a)+".";

}

document.getElementById("nextButton").disabled=false;

}



/* NEXT QUESTION */

function nextQuestion(){

if(!answered)return;

currentIndex++;

if(currentIndex<currentQuestions.length){

showQuestion();

}else{

showResult();

}

}



/* SHOW RESULT */

function showResult(){

document.getElementById("quiz").style.display="none";

document.getElementById("result").style.display="block";

document.getElementById("score").textContent=
score+" / "+currentQuestions.length;

let message="Keep practicing! 💪";

const percentage=
(score/currentQuestions.length)*100;

if(percentage===100){

message="🔥 Perfect score! Amazing work!";

}else if(percentage>=70){

message="🎉 Great job! Keep going!";

}else if(percentage>=50){

message="👍 Good effort! A little more practice.";

}else{

message="💪 Don't worry. Study the topic and try again.";

}

document.getElementById("resultText").textContent=
message;

}



/* RESTART */

function restartQuiz(){

startQuiz(currentSubject);

}



/* HOME */

function goHome(){

document.getElementById("result").style.display="none";

document.getElementById("quiz").style.display="none";

document.getElementById("home").style.display="block";

}

</script>


</body>
  </html>
