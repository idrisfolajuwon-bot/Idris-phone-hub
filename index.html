<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Idris Phone Hub</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f6f8;
  color:#111827;
}

header{
  background:#111827;
  color:white;
  position:sticky;
  top:0;
  z-index:100;
  padding:15px;
  box-shadow:0 2px 10px #0002;
}

.header{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.logo{
  font-size:23px;
  font-weight:bold;
}

.logo span{
  color:#22c55e;
}

.sellTop{
  background:#22c55e;
  color:white;
  border:0;
  padding:11px 15px;
  border-radius:9px;
  font-weight:bold;
  cursor:pointer;
}

.hero{
  background:linear-gradient(135deg,#111827,#263449);
  color:white;
  text-align:center;
  padding:45px 15px;
}

.hero h1{
  font-size:34px;
  margin-bottom:10px;
}

.hero p{
  color:#d1d5db;
  margin-bottom:22px;
}

.search{
  max-width:650px;
  margin:auto;
  display:flex;
}

.search input{
  flex:1;
  padding:15px;
  border:0;
  outline:0;
  border-radius:10px 0 0 10px;
  font-size:16px;
}

.search button{
  border:0;
  background:#22c55e;
  color:white;
  padding:0 20px;
  border-radius:0 10px 10px 0;
  cursor:pointer;
}

.container{
  max-width:1200px;
  margin:25px auto;
  padding:0 15px;
}

.brands{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding:5px 0 15px;
}

.brand{
  border:1px solid #ddd;
  background:white;
  padding:10px 15px;
  border-radius:25px;
  white-space:nowrap;
  cursor:pointer;
}

.brand.active,
.brand:hover{
  background:#22c55e;
  color:white;
  border-color:#22c55e;
}

.titleRow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:15px 0;
}

.titleRow h2{
  font-size:24px;
}

.count{
  color:#666;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
}

.card{
  background:white;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 3px 14px #00000012;
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
}

.imageBox{
  width:100%;
  height:210px;
  background:#eef0f3;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.imageBox img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.phoneEmoji{
  font-size:75px;
}

.cardBody{
  padding:15px;
}

.cardBody h3{
  margin-bottom:7px;
}

.price{
  color:#16a34a;
  font-size:20px;
  font-weight:bold;
  margin:7px 0;
}

.info{
  color:#666;
  font-size:14px;
  margin:6px 0;
}

.view{
  width:100%;
  border:0;
  background:#111827;
  color:white;
  padding:11px;
  border-radius:8px;
  margin-top:10px;
  cursor:pointer;
}

.empty{
  text-align:center;
  padding:50px 10px;
  display:none;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0009;
  z-index:500;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modalBox{
  background:white;
  width:100%;
  max-width:550px;
  max-height:92vh;
  overflow-y:auto;
  border-radius:15px;
  padding:22px;
  position:relative;
}

.close{
  position:absolute;
  right:18px;
  top:12px;
  font-size:28px;
  cursor:pointer;
}

.modalBox h2{
  margin-bottom:18px;
}

.bigImage{
  height:260px;
  background:#eef0f3;
  border-radius:12px;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  margin-bottom:15px;
}

.bigImage img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.bigEmoji{
  font-size:90px;
}

.detailPrice{
  color:#16a34a;
  font-size:26px;
  font-weight:bold;
  margin:8px 0;
}

.formGroup{
  margin-bottom:15px;
}

.formGroup label{
  display:block;
  font-weight:bold;
  margin-bottom:6px;
}

.formGroup input,
.formGroup select,
.formGroup textarea{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:8px;
  outline:none;
  font-size:15px;
}

.formGroup textarea{
  height:90px;
  resize:none;
}

.submit{
  width:100%;
  border:0;
  background:#22c55e;
  color:white;
  padding:14px;
  border-radius:9px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.loading{
  text-align:center;
  padding:30px;
}

footer{
  margin-top:50px;
  background:#111827;
  color:white;
  text-align:center;
  padding:30px 15px;
}

footer p{
  color:#aaa;
  margin-top:8px;
}

@media(max-width:500px){

  .logo{
    font-size:18px;
  }

  .sellTop{
    padding:9px 11px;
  }

  .hero h1{
    font-size:28px;
  }

  .products{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .imageBox{
    height:160px;
  }

  .cardBody{
    padding:11px;
  }

  .cardBody h3{
    font-size:15px;
  }

  .price{
    font-size:17px;
  }
}
</style>
</head>

<body>

<header>
<div class="header">

<div class="logo">
Idris <span>Phone Hub</span>
</div>

<button class="sellTop" onclick="openSell()">
+ Sell Phone
</button>

</div>
</header>


<section class="hero">

<h1>Idris Phone Hub 📱</h1>

<p>Buy and sell phones in Nigeria.</p>

<div class="search">

<input
id="search"
type="text"
placeholder="Search iPhone 12, Tecno Camon, Samsung..."
oninput="renderPhones()"
>

<button onclick="renderPhones()">
Search
</button>

</div>

</section>


<main class="container">

<div class="brands" id="brands"></div>

<div class="titleRow">

<h2 id="title">All Phones</h2>

<span class="count" id="count"></span>

</div>

<div id="products" class="products">

<div class="loading">
Loading phones...
</div>

</div>

<div id="empty" class="empty">

<h2>No phones found 😔</h2>

<p>Try another search or brand.</p>

</div>

</main>


<footer>

<h2>Idris Phone Hub</h2>

<p>Buy. Sell. Upgrade. 📱</p>

<p>© 2026 Idris Phone Hub</p>

</footer>


<!-- DETAILS -->

<div class="modal" id="detailsModal">

<div class="modalBox">

<span class="close" onclick="closeDetails()">×</span>

<div class="bigImage" id="detailImage"></div>

<h2 id="detailName"></h2>

<div class="detailPrice" id="detailPrice"></div>

<p id="detailBrand"></p>

<p id="detailLocation"></p>

<p id="detailCondition"></p>

<br>

<p id="detailDescription"></p>

<br>

<button class="submit" onclick="contactSeller()">
Contact Seller
</button>

</div>

</div>


<!-- SELL -->

<div class="modal" id="sellModal">

<div class="modalBox">

<span class="close" onclick="closeSell()">×</span>

<h2>Sell Your Phone 📱</h2>

<form id="sellForm">

<div class="formGroup">

<label>Phone Model</label>

<input
id="phoneName"
placeholder="Example: iPhone 14 Pro"
required
>

</div>


<div class="formGroup">

<label>Brand</label>

<select id="phoneBrand" required>

<option value="">Choose brand</option>

</select>

</div>


<div class="formGroup">

<label>Price (₦)</label>

<input
id="phonePrice"
type="number"
placeholder="Example: 350000"
required
>

</div>


<div class="formGroup">

<label>Location</label>

<input
id="phoneLocation"
placeholder="Example: Lagos"
required
>

</div>


<div class="formGroup">

<label>Condition</label>

<select id="phoneCondition" required>

<option value="">Choose condition</option>

<option>Brand New</option>
<option>UK Used</option>
<option>Tokunbo</option>
<option>Fairly Used</option>
<option>Used</option>

</select>

</div>


<div class="formGroup">

<label>Phone Image URL</label>

<input
id="phoneImage"
placeholder="Paste an image URL"
>

</div>


<div class="formGroup">

<label>Description</label>

<textarea
id="phoneDescription"
placeholder="Describe the phone..."
required
></textarea>

</div>


<div class="formGroup">

<label>Seller Name</label>

<input
id="sellerName"
placeholder="Your name"
required
>

</div>


<div class="formGroup">

<label>Seller Phone Number</label>

<input
id="sellerPhone"
type="tel"
placeholder="08012345678"
required
>

</div>


<button class="submit" type="submit">
Post Phone
</button>

</form>

</div>

</div>

let phones=[];

let currentBrand="All";

let selectedPhone=null;


function createBrands(){

const box=document.getElementById("brands");

const select=document.getElementById("phoneBrand");

brands.forEach((brand,index)=>{

const button=document.createElement("button");

button.className="brand"+(index===0?" active":"");

button.textContent=brand;

button.onclick=()=>{

currentBrand=brand;

document
.querySelectorAll(".brand")
.forEach(x=>x.classList.remove("active"));

button.classList.add("active");

document.getElementById("title").textContent=
brand==="All"?"All Phones":brand+" Phones";

renderPhones();

};

box.appendChild(button);


if(brand!=="All"){

const option=document.createElement("option");

option.value=brand;

option.textContent=brand;

select.appendChild(option);

}

});

}


function imageHTML(phone,big=false){

if(phone.image){

return `<img src="${phone.image}" alt="${phone.name}"
onerror="this.style.display='none';this.parentElement.innerHTML='<span class=phoneEmoji>📱</span>'">`;

}

return `<span class="${big?'bigEmoji':'phoneEmoji'}">📱</span>`;

}


function renderPhones(){

const box=document.getElementById("products");

const search=document
.getElementById("search")
.value
.toLowerCase()
.trim();


let filtered=phones.filter(phone=>{

const brandMatch=
currentBrand==="All" ||
phone.brand===currentBrand ||
(currentBrand==="Xiaomi" &&
(phone.brand==="Xiaomi"||phone.brand==="Redmi"));

const searchMatch=
!search ||
phone.name.toLowerCase().includes(search) ||
phone.brand.toLowerCase().includes(search) ||
(phone.location||"").toLowerCase().includes(search);

return brandMatch&&searchMatch;

});


box.innerHTML="";

document.getElementById("count").textContent=
filtered.length+" phone"+(filtered.length===1?"":"s");


if(filtered.length===0){

document.getElementById("empty").style.display="block";

return;

}

document.getElementById("empty").style.display="none";


filtered.forEach(phone=>{

const card=document.createElement("div");

card.className="card";

card.innerHTML=`

<div class="imageBox">
${imageHTML(phone)}
</div>

<div class="cardBody">

<h3>${escapeHTML(phone.name)}</h3>

<div class="price">
₦${Number(phone.price||0).toLocaleString()}
</div>

<div class="info">
🏷️ ${escapeHTML(phone.brand)}
</div>

<div class="info">
📍 ${escapeHTML(phone.location||"Nigeria")}
</div>

<div class="info">
📦 ${escapeHTML(phone.condition||"Available")}
</div>

<button class="view">
View Phone
</button>

</div>

`;

card.querySelector(".view").onclick=()=>showDetails(phone);

box.appendChild(card);

});

}


function escapeHTML(text){

return String(text||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function showDetails(phone){

selectedPhone=phone;

document.getElementById("detailImage").innerHTML=
imageHTML(phone,true);

document.getElementById("detailName").textContent=
phone.name;

document.getElementById("detailPrice").textContent=
"₦"+Number(phone.price||0).toLocaleString();

document.getElementById("detailBrand").textContent=
"🏷️ Brand: "+phone.brand;

document.getElementById("detailLocation").textContent=
"📍 Location: "+(phone.location||"Nigeria");

document.getElementById("detailCondition").textContent=
"📦 Condition: "+(phone.condition||"Not specified");

document.getElementById("detailDescription").textContent=
phone.description||"No description provided.";

document.getElementById("detailsModal").style.display="flex";

}


function closeDetails(){

document.getElementById("detailsModal").style.display="none";

}


function openSell(){

document.getElementById("sellModal").style.display="flex";

}


function closeSell(){

document.getElementById("sellModal").style.display="none";

}


window.contactSeller=function(){

if(!selectedPhone){

return;

}

if(selectedPhone.sellerPhone){

window.location.href=
"tel:"+selectedPhone.sellerPhone;

}else{

alert("Seller contact is not available yet.");

}

};


document.getElementById("sellForm").addEventListener(
"submit",
async function(event){

event.preventDefault();


const button=this.querySelector("button");

button.disabled=true;

button.textContent="Posting...";


try{

await addDoc(
collection(db,"phones"),
{

name:document.getElementById("phoneName").value.trim(),

brand:document.getElementById("phoneBrand").value,

price:Number(document.getElementById("phonePrice").value),

location:document.getElementById("phoneLocation").value.trim(),

condition:document.getElementById("phoneCondition").value,

image:document.getElementById("phoneImage").value.trim(),

description:document.getElementById("phoneDescription").value.trim(),

sellerName:document.getElementById("sellerName").value.trim(),

sellerPhone:document.getElementById("sellerPhone").value.trim(),

createdAt:serverTimestamp()

}

);


alert("🎉 Your phone has been posted!");

this.reset();

closeSell();


}catch(error){

console.error(error);

alert(
"Something went wrong. Check that Firestore is enabled."
);

}


button.disabled=false;

button.textContent="Post Phone";

});


function loadPhones(){

const phonesQuery=query(
collection(db,"phones"),
orderBy("createdAt","desc")
);


onSnapshot(
phonesQuery,
snapshot=>{

phones=snapshot.docs.map(doc=>({

id:doc.id,
...doc.data()

}));

renderPhones();

},
error=>{

console.error(error);

phones=[];

renderPhones();

}
);

}


createBrands();

loadPhones();


window.onclick=function(event){

if(event.target===
document.getElementById("detailsModal")){

closeDetails();

}

if(event.target===
document.getElementById("sellModal")){

closeSell();

}

};
