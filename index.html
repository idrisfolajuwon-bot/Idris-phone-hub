<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Idris Phone Hub</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f6f8;
  color:#111;
}

header{
  background:#111827;
  color:white;
  padding:18px 15px;
  position:sticky;
  top:0;
  z-index:100;
}

.header{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-size:23px;
  font-weight:bold;
}

.logo span{
  color:#22c55e;
}

.sell-btn{
  background:#22c55e;
  color:white;
  border:0;
  padding:11px 15px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.hero{
  background:linear-gradient(135deg,#111827,#1f2937);
  color:white;
  text-align:center;
  padding:45px 15px;
}

.hero h1{
  font-size:32px;
  margin-bottom:10px;
}

.hero p{
  color:#d1d5db;
  margin-bottom:22px;
}

.search{
  max-width:600px;
  margin:auto;
  display:flex;
}

.search input{
  width:100%;
  padding:15px;
  border:0;
  outline:none;
  border-radius:10px 0 0 10px;
  font-size:16px;
}

.search button{
  border:0;
  background:#22c55e;
  color:white;
  padding:0 20px;
  border-radius:0 10px 10px 0;
  cursor:pointer;
}

.container{
  max-width:1100px;
  margin:30px auto;
  padding:0 15px;
}

.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding-bottom:10px;
  margin-bottom:25px;
}

.category{
  background:white;
  border:1px solid #ddd;
  padding:10px 16px;
  border-radius:20px;
  white-space:nowrap;
  cursor:pointer;
}

.category.active,
.category:hover{
  background:#22c55e;
  color:white;
  border-color:#22c55e;
}

.section-title{
  margin-bottom:18px;
  font-size:24px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
}

.card{
  background:white;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
}

.phone-img{
  width:100%;
  height:210px;
  background:#e5e7eb;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:70px;
}

.card-body{
  padding:16px;
}

.card h3{
  margin-bottom:8px;
}

.price{
  color:#16a34a;
  font-size:20px;
  font-weight:bold;
  margin-bottom:8px;
}

.location{
  color:#666;
  font-size:14px;
  margin-bottom:14px;
}

.view-btn{
  width:100%;
  border:0;
  background:#111827;
  color:white;
  padding:11px;
  border-radius:8px;
  cursor:pointer;
}

.no-result{
  text-align:center;
  padding:40px;
  display:none;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:200;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal-box{
  background:white;
  width:100%;
  max-width:500px;
  max-height:90vh;
  overflow:auto;
  border-radius:15px;
  padding:22px;
  position:relative;
}

.close{
  position:absolute;
  right:18px;
  top:15px;
